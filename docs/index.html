<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铝型材 CBAM 碳核算平台</title><meta name="description" content="铝型材排放盘查、CBAM 核算与报告管理"><style>body{margin:0;background:#f3f7fc;color:#183a57;font:16px/1.8 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{max-width:560px;padding:48px 28px}h1{font-size:34px;line-height:1.3}a{display:inline-block;background:#196fbd;color:white;padding:12px 26px;border-radius:8px;text-decoration:none}small{display:block;color:#6a7d90;margin-top:24px}</style></head><body><main><p>ALUMINIUM · CBAM</p><h1>铝型材 CBAM<br>碳核算平台</h1><p>排放盘查、成本核算、PDF / Excel 报告及记录管理。</p><a id="launch" href="#">进入平台 →</a><small id="status">正在连接平台…</small></main><script>
